name: Test
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  Unit:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22,24,26]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm i && pnpm build
      - run: pnpm playwright install --with-deps
      - run: pnpm test
        env:
          CI: true
          NODE_VERSION: ${{ matrix.node-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: my-artifacts-${{inputs.context}}-${{inputs.job-index}}-node${{ matrix.node-version }}
          path: playwright-report/
        if: failure()
      - uses: actions/download-artifact@v8
        with:
          pattern: my-artifacts-${{inputs.context}}*
          merge-multiple: true
        if: failure()
  Compatibility:
    name: Runtime compatibility (Next.js ${{ matrix.nextjs-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - nextjs-version: 14
            react-version: 18
            react-types-version: 18
          - nextjs-version: 15
            react-version: 19
            react-types-version: 19
          - nextjs-version: 16
            react-version: 19
            react-types-version: 19
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm compat:prepare
      - name: Install compatibility versions
        run: >-
          pnpm --dir next-app-runtime --ignore-workspace add --ignore-scripts
          next@^${{ matrix.nextjs-version }}
          react@^${{ matrix.react-version }}
          react-dom@^${{ matrix.react-version }}
          @types/react@^${{ matrix.react-types-version }}
          @types/react-dom@^${{ matrix.react-types-version }}
          ./next-navigation-utils.tgz
      - run: pnpm --dir next-app-runtime --ignore-workspace exec tsc -p tsconfig.types.json
      - run: pnpm playwright install --with-deps
      - run: pnpm unit
        env:
          CI: true
          NEXT_APP_DIRECTORY: next-app-runtime
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - run: pnpm lint
  Types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - run: pnpm tsc
  Test:
    needs: [ Compatibility, Lint, Unit, Types ]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "Ready to merge!"
