when:
  - event: [push, pull_request]

matrix:
  include:
    - NODE: '22'
      NODE_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
    - NODE: '24'
      NODE_IMAGE: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    - NODE: '26'
      NODE_IMAGE: node:26-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49

steps:
  - name: browser-tests
    image: ${NODE_IMAGE}
    environment:
      CI: 'true'
      NODE_VERSION: ${NODE}
    commands:
      - npm install --global pnpm@12.5.1
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm playwright install --with-deps
      - pnpm test
