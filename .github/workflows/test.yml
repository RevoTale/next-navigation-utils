name: Test
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  Unit:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22,24,26]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm i && pnpm build
      - run: pnpm playwright install --with-deps
      - run: pnpm test
        env:
          CI: true
          NODE_VERSION: ${{ matrix.node-version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: my-artifacts-${{inputs.context}}-${{inputs.job-index}}-node${{ matrix.node-version }}
          path: playwright-report/
        if: failure()
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: my-artifacts-${{inputs.context}}*
          merge-multiple: true
        if: failure()
  Compatibility:
    name: Runtime compatibility (Next.js ${{ matrix.nextjs-version }}, ${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - nextjs-version: 14.0.0
            release: minimum
            react-version: 18.2.0
            react-types-version: 18
          - nextjs-version: ^14
            release: current
            react-version: ^18.2.0
            react-types-version: 18
          - nextjs-version: 15.0.0
            release: minimum
            react-version: 18.2.0
            react-types-version: 18
          - nextjs-version: ^15
            release: current
            react-version: ^19.0.0
            react-types-version: 19
          - nextjs-version: 16.0.0
            release: minimum
            react-version: 19.0.0
            react-types-version: 19
          - nextjs-version: ^16
            release: current
            react-version: ^19.2.0
            react-types-version: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm compat:prepare
      - name: Install compatibility versions
        run: >-
          pnpm --dir next-app-runtime --ignore-workspace add --ignore-scripts
          next@${{ matrix.nextjs-version }}
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@^${{ matrix.react-types-version }}
          @types/react-dom@^${{ matrix.react-types-version }}
          ./next-navigation-utils.tgz
      - run: pnpm --dir next-app-runtime --ignore-workspace exec tsc -p tsconfig.types.json
      - run: node next-app-runtime/commonjs.cjs
      - run: pnpm playwright install --with-deps
      - run: pnpm unit
        env:
          CI: true
          NEXT_APP_DIRECTORY: next-app-runtime
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - run: pnpm lint
  Types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - run: pnpm tsc
  Test:
    needs: [ Compatibility, Lint, Unit, Types ]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "Ready to merge!"
